<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Movimentações | AlmoxControl</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/movimentacao.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container">
      <!-- SIDEBAR -->

      <nav class="nav-container">
        <div class="sidebar-header">
          <i class="fa-solid fa-toolbox"></i>

          <div>
            <h1>AlmoxControl</h1>
            <span>Sistema ERP</span>
          </div>
        </div>

        <ul class="menu">
          <li>
            <a href="index.html">
              <i class="fa-solid fa-house"></i>
              Dashboard
            </a>
          </li>

          <li>
            <a href="ferramentas.html">
              <i class="fa-solid fa-wrench"></i>
              Ferramentas
            </a>
          </li>

          <li>
            <a class="active" href="movimentacao.html">
              <i class="fa-solid fa-arrow-right-arrow-left"></i>
              Movimentações
            </a>
          </li>
          <li>
            <a  href="colaboradores.html">

                    <i class="fa-solid fa-user-group"></i>

                    Colaboradores

                </a>
          </li>
          <li>
            <a href="almoxarifado.html">
              <i class="fa-solid fa-boxes-stacked"></i>
              <span>Insumos</span>
            </a>
          </li>
        </ul>

        <div class="sidebar-footer">
          <div class="avatar">M</div>

          <div>
            <strong>Marcos</strong>
            <span>Administrador</span>
          </div>
        </div>
      </nav>

      <!-- CONTEÚDO -->

      <div class="content">
        <header class="topo-movimentacao">
          <div>
            <h2>Movimentações</h2>

            <p class="subtitulo">
              Histórico de empréstimos e devoluções de ferramentas.
            </p>
          </div>

          <button id="btnNovaMovimentacao" class="btn-nova">
            <i class="fa-solid fa-plus"></i>

            Nova movimentação
          </button>
        </header>

        <section class="card-tabela">
          <div class="barra-superior">
            <div class="pesquisa">
              <i class="fa-solid fa-magnifying-glass"></i>

              <input
                id="pesquisaMovimentacao"
                type="text"
                placeholder="Pesquisar ferramenta ou colaborador..."
              />
            </div>

            <div class="filtros">
              <select id="filtroMovimentacao">
                <option>Todos</option>
                <option>Empréstimos</option>
                <option>Devoluções</option>
              </select>

              <span class="contador">
                Total:
                <strong id="totalMovimentacoes">0</strong>
              </span>
            </div>
          </div>

          <div class="table-responsive">
            <table id="tabelaMovimentacoes">
              <thead>
                <tr>
                  <th>Data / hora</th>
                  <th>Ferramenta</th>
                  <th>Colaborador</th>
                  <th>Tipo</th>
                  <th>Devolução</th>
                  <th>Status</th>
                  <th>Ações</th>
                </tr>
              </thead>

              <tbody id="listaMovimentacoes"></tbody>
            </table>
          </div>
        </section>
        <!-- MODAL NOVA MOVIMENTAÇÃO -->

        <div id="modalMovimentacao" class="modal">
          <div class="modal-content">
            <h2>Nova Movimentação</h2>

            <form id="formMovimentacao">
              <label>Ferramenta</label>

              <select id="ferramentaMovimentacao"></select>

              <label>Colaborador</label>

             <select id="colaboradorMovimentacao"></select>

              <label>Tipo</label>

              <select id="tipoMovimentacao">
                <option value="emprestimo">Empréstimo</option>

                <option value="devolucao">Devolução</option>
              </select>

              <label>Data de devolução</label>

              <input id="dataDevolucao" type="date" />

              <label>Observação</label>

              <textarea
                id="observacaoMovimentacao"
                placeholder="Observação..."
              ></textarea>

              <div class="botoes-modal">
                <button type="button" id="fecharModalMovimentacao">
                  Cancelar
                </button>

                <button type="submit">Salvar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/movimentacao.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
