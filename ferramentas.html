<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ferramentas | AlmoxControl</title>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Ícones -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/ferramenta.css">

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="./assets/img/icon.jpg">
</head>

<body>

    <div class="container">

        <!-- =========================
             SIDEBAR
        ========================== -->

        <nav class="nav-container">

            <div class="sidebar-header">

                <i class="fa-solid fa-toolbox"></i>

                <div>
                    <h1>AlmoxControl</h1>
                    <span>Sistema ERP</span>
                </div>

            </div>


            <ul class="menu">

                <li>
                    <a href="index.html">
                        <i class="fa-solid fa-house"></i>
                        <span>Dashboard</span>
                    </a>
                </li>

                <li>
                    <a
                        class="active"
                        href="ferramentas.html"
                    >
                        <i class="fa-solid fa-wrench"></i>
                        <span>Ferramentas</span>
                    </a>
                </li>

                <li>
                    <a href="movimentacao.html">
                        <i class="fa-solid fa-arrow-right-arrow-left"></i>
                        <span>Movimentações</span>
                    </a>
                </li>

                <li>
                    <a href="colaboradores.html">
                        <i class="fa-solid fa-user-group"></i>
                        <span>Colaboradores</span>
                    </a>
                </li>
                <li>
            <a href="almoxarifado.html">
              <i class="fa-solid fa-boxes-stacked"></i>
              <span>Insumos</span>
            </a>
          </li>

            </ul>


            <div class="sidebar-footer">

                <div class="avatar">M</div>

                <div>
                    <strong>Marcos</strong>
                    <span>Administrador</span>
                </div>

            </div>

        </nav>


        <!-- =========================
             CONTEÚDO PRINCIPAL
        ========================== -->

        <div class="content">

            <!-- CABEÇALHO -->

            <header class="topo-ferramentas">

                <div>

                    <h2>Ferramentas</h2>

                    <p class="subtitulo">
                        Gerencie todas as ferramentas cadastradas.
                    </p>

                </div>


                <button
                    type="button"
                    id="btnAdicionarFerramenta"
                    class="btn-ferramenta"
                >
                    <i class="fa-solid fa-plus"></i>
                    <span>Nova ferramenta</span>
                </button>

            </header>


            <!-- =========================
                 TABELA DE FERRAMENTAS
            ========================== -->

            <section class="card-tabela">

                <!-- BARRA SUPERIOR -->

                <div class="barra-superior">

                    <div class="pesquisa">

                        <i class="fa-solid fa-magnifying-glass"></i>

                        <input
                            id="pesquisaFerramenta"
                            type="search"
                            placeholder="Pesquisar ferramenta..."
                            autocomplete="off"
                        >

                    </div>


                    <span class="contador">
                        Total:
                        <strong id="totalFerramentas">0</strong>
                    </span>

                </div>


                <!-- TABELA -->

                <div class="table-responsive">

                    <table id="tabelaFerramentas">

                        <thead>

                            <tr>
                                <th scope="col">Código</th>
                                <th scope="col">Ferramenta</th>
                                <th scope="col">Categoria</th>
                                <th scope="col">Status</th>
                                <th scope="col">Ações</th>
                            </tr>

                        </thead>


                        <tbody id="listaFerramentas">
                            <!-- Ferramentas inseridas pelo JavaScript -->
                        </tbody>

                    </table>

                </div>

            </section>

        </div>

    </div>


    <!-- =========================
         MODAL — NOVA FERRAMENTA
    ========================== -->

    <div
        id="modalFerramenta"
        class="modal"
        aria-hidden="true"
    >

        <div
            class="modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="tituloModalFerramenta"
        >

            <h2 id="tituloModalFerramenta">
                Nova ferramenta
            </h2>


            <form id="formFerramenta">

                <!-- NOME -->

                <div class="campo-formulario">

                    <label for="nomeFerramenta">
                        Nome
                    </label>

                    <input
                        id="nomeFerramenta"
                        type="text"
                        placeholder="Ex: Furadeira Bosch"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- CÓDIGO -->

                <div class="campo-formulario">

                    <label for="codigoFerramenta">
                        Código
                    </label>

                    <input
                        id="codigoFerramenta"
                        type="text"
                        placeholder="Ex: 001"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- CATEGORIA -->

                <div class="campo-formulario">

                    <label for="categoriaFerramenta">
                        Categoria
                    </label>

                    <input
                        id="categoriaFerramenta"
                        type="text"
                        placeholder="Ex: Elétrica"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- STATUS -->

                <div class="campo-formulario">

                    <label for="statusFerramenta">
                        Status
                    </label>

                    <select
                        id="statusFerramenta"
                        required
                    >

                        <option value="disponivel">
                            Disponível
                        </option>

                        <option value="em-uso">
                            Em uso
                        </option>

                        <option value="manutencao">
                            Manutenção
                        </option>

                    </select>

                </div>


                <!-- BOTÕES -->

                <div class="botoes-modal">

                    <button
                        type="button"
                        id="fecharModal"
                    >
                        Cancelar
                    </button>


                    <button type="submit">
                        Salvar
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/ferramentas.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
```
